# For local runs, values are read from the git-ignored .env file in the project root.
# On Render (or any host) there is no .env file, so real environment variables are used instead.
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:campusbalance}
server.port=${PORT:8080}

# A blank number field arrives as null — reject it instead of silently treating it as 0
spring.jackson.deserialization.fail-on-null-for-primitives=true

# Login tokens. JWT_SECRET must be at least 32 characters; if unset, a random key is used
# and everyone is logged out whenever the server restarts.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-hours=${JWT_TTL_HOURS:24}
