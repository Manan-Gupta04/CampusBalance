<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusBalance | Student Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1>CampusBalance</h1>
            <p class="subtitle" id="subtitle">Student Well-being Analytics</p>

            <form id="authForm">
                <label for="uid">Username / College ID</label>
                <input type="text" id="uid" placeholder="e.g. cs23001" autocomplete="username" required>

                <div id="regFields" hidden>
                    <label for="uname">Full name</label>
                    <input type="text" id="uname" placeholder="Enter your name" autocomplete="name">
                    <label for="udept">Department</label>
                    <input type="text" id="udept" placeholder="e.g. CSE">
                </div>

                <label for="psw">Password</label>
                <input type="password" id="psw" placeholder="••••••••" autocomplete="current-password" required>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block" id="mainBtn">Log In</button>
                </div>
            </form>

            <div class="divider"><span>or</span></div>
            <button class="btn btn-outline btn-block" id="toggleBtn" onclick="toggleMode()">Create a student account</button>

            <p class="auth-footer">Faculty or admin? <a href="staff-login.html">Staff login</a></p>
        </div>
    </div>

    <script>
        let isRegisterMode = false;

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('regFields').hidden = !isRegisterMode;
            document.getElementById('subtitle').innerText = isRegisterMode ? 'Create your student account' : 'Student Well-being Analytics';
            document.getElementById('mainBtn').innerText = isRegisterMode ? 'Create Account' : 'Log In';
            document.getElementById('toggleBtn').innerText = isRegisterMode ? 'Back to login' : 'Create a student account';
            document.getElementById('psw').autocomplete = isRegisterMode ? 'new-password' : 'current-password';
        }

        async function register(username, password) {
            const name = document.getElementById('uname').value.trim();
            const department = document.getElementById('udept').value.trim();
            if (!name) return toast('Please enter your name', 'error');

            // This page only ever creates STUDENT accounts — the backend enforces that too.
            const res = await api('/api/register', { method: 'POST', auth: false, body: { username, name, password, department } });
            if (!res.ok) return toast(await errorText(res, 'Registration failed.'), 'error');
            toast('Account created! You can log in now.', 'success');
            toggleMode();
        }

        async function login(username, password) {
            Session.clear(); // drop any old/expired login before starting a new one
            const res = await api('/api/login', { method: 'POST', auth: false, body: { username, password } });
            if (!res.ok) return toast('Incorrect username or password', 'error');
            const account = await res.json();
            Session.save(account);
            window.location.href = HOME_PAGE_BY_ROLE[account.role] || 'index.html';
        }

        document.getElementById('authForm').addEventListener('submit', e => {
            e.preventDefault();
            const username = document.getElementById('uid').value.trim();
            const password = document.getElementById('psw').value;
            if (!username || !password) return toast('Please fill in your ID and password', 'error');
            withBusy(e.submitter, () => isRegisterMode ? register(username, password) : login(username, password));
        });
    </script>
</body>
</html>
