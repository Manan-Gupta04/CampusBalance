<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusBalance | Wellbeing Summary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
    <style>
        .report { max-width: 860px; margin: 0 auto; padding: 32px 20px 48px; }
        .report-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
        .report-head h1 { color: var(--primary); }
        .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        .fact .card-label { margin-bottom: 2px; }
        .fact .value { font-size: 22px; font-weight: 800; }
        .report table td, .report table th { padding: 7px 10px; }
        .report .sparkline { width: 100%; height: auto; margin-bottom: 12px; }
        .disclaimer { font-size: 12px; color: var(--muted); margin-top: 24px; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff; }
            .report { padding: 0; max-width: none; }
            .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
        }
    </style>
</head>
<body>
    <main class="report">
        <div class="report-head">
            <div>
                <h1>Wellbeing Summary</h1>
                <p class="muted" id="who">Loading…</p>
            </div>
            <div class="toolbar no-print">
                <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Save as PDF</button>
                <a class="btn btn-secondary" href="index.html#/insights">Back</a>
            </div>
        </div>
        <div id="content"></div>
        <p class="disclaimer">Generated by CampusBalance from the student's own daily logs. Scores and burnout signals follow fixed,
            transparent rules — they are a conversation starter, not a clinical diagnosis.</p>
    </main>

    <script>
        const fmt = v => escapeHtml(v ?? '–');

        function table(headers, rows) {
            return `<div class="table-wrap"><table>
                <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                <tbody>${rows.join('')}</tbody>
            </table></div>`;
        }

        function render(r) {
            const s = r.student || {};
            document.getElementById('who').innerHTML = `<strong>${fmt(s.name)}</strong> (${fmt(s.username)}) · ${fmt(s.department)}
                ${r.semester ? ` · Semester ${fmt(r.semester.number)} (${fmt(r.semester.startDate)} → ${fmt(r.semester.endDate)})` : ''}
                <br>Generated ${fmt(r.generatedOn)}`;

            const parts = [];
            const c = r.current;
            parts.push(`<div class="card">
                <p class="card-label">Current status ${c ? `(as of ${fmt(c.date)})` : ''}</p>
                ${c ? `<div class="facts">
                    <div class="fact"><p class="card-label">Balance Score</p><div class="value">${fmt(c.balanceScore)}%</div></div>
                    <div class="fact"><p class="card-label">Burnout risk</p><div class="value"><span class="badge ${fmt(c.burnoutRisk)}">${fmt(c.burnoutRisk)}</span></div></div>
                    <div class="fact"><p class="card-label">Workload</p><div class="value">${fmt(c.workloadPercent)}%</div><small>of a 60-hour week</small></div>
                    <div class="fact"><p class="card-label">Sustained overload</p><div class="value">${c.sustainedOverload ? '⚠️ Yes' : 'No'}</div></div>
                </div>` : '<p class="muted">No scores recorded yet.</p>'}
            </div>`);

            const b = r.burnout || { flags: [], tier: 0 };
            parts.push(`<div class="card">
                <p class="card-label">Burnout signals</p>
                <div class="tier-note t${Number(b.tier)}">${escapeHtml(TIER_LABELS[b.tier] || '')}</div>
                ${b.flags.length ? `<div class="flag-list">${b.flags.map(f => `
                    <div class="flag">${signalChips([f], { short: true })}<div><strong>${fmt(f.name)}</strong><br><span class="muted">${fmt(f.reason)}</span></div></div>`).join('')}
                </div>` : ''}
            </div>`);

            const history = r.balanceHistory || [];
            if (history.length) {
                parts.push(`<div class="card">
                    <p class="card-label">Balance Score — last ${history.length} recorded days</p>
                    ${sparkline(history.map(h => h.balanceScore), 600, 80)}
                    ${table(['Date', 'Balance Score', 'Workload', 'Risk'], history.slice().reverse().map(h => `<tr>
                        <td>${fmt(h.date)}</td><td>${fmt(h.balanceScore)}%</td><td>${fmt(h.workloadPercent)}%</td>
                        <td><span class="badge ${fmt(h.burnoutRisk)}">${fmt(h.burnoutRisk)}</span></td></tr>`))}
                </div>`);
            }

            const checkIns = r.checkIns || [];
            if (checkIns.length) {
                const a = r.averages || {};
                parts.push(`<div class="card">
                    <p class="card-label">Daily check-ins — last ${checkIns.length}</p>
                    <p>Average sleep <strong>${fmt(a.sleepHours)}h</strong> · average study <strong>${fmt(a.studyHours)}h</strong> ·
                       stressed on <strong>${fmt(a.stressedDays)}</strong> of ${checkIns.length} days</p>
                    ${table(['Date', 'Sleep', 'Study', 'Mood', 'Energy'], checkIns.map(l => `<tr>
                        <td>${fmt(l.date)}</td><td>${fmt(l.sleepHours)}h</td><td>${fmt(l.studyHours)}h</td>
                        <td>${fmt(l.mood)}</td><td>${fmt(l.energyLevel)}/5</td></tr>`))}
                </div>`);
            }

            if (r.focusActivities || r.recoveryActivities || r.pendingAssignments) {
                const acts = list => (list || []).map(x => `${fmt(x.name)} (${fmt(x.weight)})`).join(', ') || 'none';
                const pending = r.pendingAssignments || [];
                parts.push(`<div class="card">
                    <p class="card-label">Current load</p>
                    <p><strong>Focus activities:</strong> ${acts(r.focusActivities)}<br>
                       <strong>Recovery activities:</strong> ${acts(r.recoveryActivities)}</p>
                    <p><strong>${pending.length}</strong> pending assignment${pending.length === 1 ? '' : 's'}</p>
                    ${pending.length ? table(['Assignment', 'Subject', 'Deadline'], pending.map(t => `<tr>
                        <td>${fmt(t.title)}</td><td>${fmt(t.subject)}</td><td>${fmt((t.deadline || '').replace('T', ' '))}</td></tr>`)) : ''}
                </div>`);
            }

            const plan = r.copingPlan;
            if (plan) {
                parts.push(`<div class="card">
                    <p class="card-label">Coping plan</p>
                    <p><strong>${fmt(plan.title)}</strong> · ${fmt(plan.startDate)} → ${fmt(plan.endDate)} · ${fmt(plan.status.replace('_', ' ').toLowerCase())}</p>
                    ${table(['Week', 'Goal', 'Progress'], plan.weeks.map(w => `<tr>
                        <td>${Number(w.week)}</td><td>${fmt(w.goal)}</td><td>${Number(w.achieved)}/${Number(w.target)} · ${fmt(w.status.replace('_', ' ').toLowerCase())}</td></tr>`))}
                </div>`);
            }

            document.getElementById('content').innerHTML = parts.join('');
        }

        async function load() {
            const res = await api(`/api/report/${encodeURIComponent(Session.user)}`);
            if (!res.ok) return toast(await errorText(res), 'error');
            render(await res.json());
        }

        if (requireRole('STUDENT')) load();
    </script>
</body>
</html>
