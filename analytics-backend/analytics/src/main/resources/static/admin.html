<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusBalance | Admin Dashboard</title>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #4361ee; --success: #4cc9f0; --danger: #f72585;
            --dark: #1a1a2e; --light: #f8f9fa; --card-bg: #ffffff;
        }
        body { font-family: 'Inter', sans-serif; background: var(--light); margin: 0; display: flex; color: #333; }

        .sidebar { width: 260px; background: var(--dark); color: white; height: 100vh; position: fixed; padding: 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--success); margin-bottom: 10px; font-size: 22px; letter-spacing: 1px; }
        .sidebar-item { padding: 14px 20px; cursor: pointer; border-radius: 10px; margin-bottom: 10px; transition: 0.3s; font-weight: 500; }
        .sidebar-item:hover { background: rgba(255,255,255,0.1); }

        .main { margin-left: 260px; padding: 40px; width: calc(100% - 260px); box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: #888; }

        input, select, button { padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn { cursor: pointer; border: none; background: var(--primary); color: white; font-weight: 600; }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>CampusBalance</h2>
        <p id="sideName" style="opacity: 0.7; margin-bottom: 20px;">Admin</p>
        <div class="sidebar-item" style="background: rgba(255,255,255,0.08);">📈 Semester Reports</div>
        <div class="sidebar-item" onclick="logout()" style="color:#ff7675; margin-top: auto;">🚪 Logout</div>
    </div>

    <div class="main">
        <div class="header">
            <h1>Institutional Semester Report</h1>
            <div style="display:flex; gap:10px; align-items:center;">
                <label style="font-size:13px; color:#888;">Semester</label>
                <input type="number" id="semInput" value="1" min="1" style="width:80px;">
                <button class="btn" onclick="loadAll()">Load</button>
            </div>
        </div>

        <div class="card" style="max-width: 500px;">
            <h3>Create Faculty Account</h3>
            <input type="text" id="fUsername" placeholder="Username">
            <input type="text" id="fName" placeholder="Full Name">
            <input type="text" id="fDept" placeholder="Department (e.g. CSE)">
            <input type="password" id="fPassword" placeholder="Password">
            <button class="btn" style="width:100%;" onclick="createFaculty()">Create Account</button>
        </div>

        <div class="stats-grid">
            <div class="card"><h3>Students in Semester</h3><h2 id="studentCount">0</h2></div>
            <div class="card"><h3>Average Balance Score</h3><h2 id="avgBalance">0%</h2></div>
            <div class="card"><h3>Average Workload Index</h3><h2 id="avgWorkload">0.0</h2></div>
        </div>

        <div class="two-col">
            <div class="card">
                <h3>Burnout Risk Distribution</h3>
                <canvas id="riskChart"></canvas>
            </div>
            <div class="card">
                <h3>Department Trend Comparison</h3>
                <canvas id="deptChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let riskChart, deptChart;

        async function loadAll() {
            await loadSemesterReport();
            await loadDepartmentTrends();
        }

        async function loadSemesterReport() {
            const sem = document.getElementById('semInput').value || 1;
            try {
                const res = await api(`/api/admin/report/${encodeURIComponent(sem)}`);
                const data = await res.json();

                document.getElementById('studentCount').innerText = data.studentCount ?? 0;
                document.getElementById('avgBalance').innerText = (data.averageBalanceScore ?? 0) + "%";
                document.getElementById('avgWorkload').innerText = data.averageWorkloadIndex ?? 0;

                const dist = data.riskDistribution || {};
                const ctx = document.getElementById('riskChart').getContext('2d');
                if (riskChart) riskChart.destroy();
                riskChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(dist),
                        datasets: [{
                            data: Object.values(dist),
                            backgroundColor: Object.keys(dist).map(k =>
                                k === 'HIGH' ? '#f72585' : k === 'MEDIUM' ? '#ff9f1c' : '#4cc9f0')
                        }]
                    }
                });
            } catch (err) { console.error("Semester report load error", err); }
        }

        async function loadDepartmentTrends() {
            try {
                const res = await api('/api/admin/trends');
                const rows = await res.json();
                const ctx = document.getElementById('deptChart').getContext('2d');
                if (deptChart) deptChart.destroy();
                deptChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: rows.map(r => `${r.department} (${r.studentCount})`),
                        datasets: [{
                            label: 'Average Balance Score',
                            data: rows.map(r => r.averageBalanceScore),
                            backgroundColor: '#4361ee'
                        }]
                    },
                    options: { scales: { y: { beginAtZero: true, max: 100 } } }
                });
            } catch (err) { console.error("Department trends load error", err); }
        }

        async function createFaculty() {
            const username = document.getElementById('fUsername').value.trim();
            const name = document.getElementById('fName').value.trim();
            const department = document.getElementById('fDept').value.trim();
            const password = document.getElementById('fPassword').value;
            if (!username || !name || !password) return alert("Please fill in username, name, and password");

            try {
                const res = await api('/api/admin/create-faculty', {
                    method: 'POST', body: { username, name, department, password }
                });
                const msg = await res.text();
                alert(msg);
                if (res.ok) {
                    document.getElementById('fUsername').value = '';
                    document.getElementById('fName').value = '';
                    document.getElementById('fDept').value = '';
                    document.getElementById('fPassword').value = '';
                }
            } catch (err) {
                alert("Could not reach the server. Is the backend running?");
            }
        }

        if (requireRole('ADMIN')) {
            document.getElementById('sideName').innerText = Session.user;
            loadAll();
        }
    </script>
</body>
</html>
