<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusBalance | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <span class="brand">CampusBalance</span>
    </header>
    <div class="backdrop"></div>

    <nav class="sidebar" aria-label="Main">
        <div class="brand">CampusBalance</div>
        <div class="who" id="sideName">Admin</div>
        <button class="nav-item active" aria-current="page">📈 Semester Reports</button>
        <div class="nav-bottom">
            <button class="nav-item" onclick="openChangePassword()">🔑 Change Password</button>
            <button class="nav-item logout" onclick="logout()">🚪 Logout</button>
        </div>
    </nav>

    <main class="main">
        <div class="page-header">
            <h1>Institutional Semester Report</h1>
            <form class="toolbar" id="reportForm">
                <label for="semInput" class="muted">Semester</label>
                <input type="number" id="semInput" value="1" min="1">
                <button type="submit" class="btn btn-primary">Load</button>
            </form>
        </div>

        <div class="stats-grid">
            <div class="card"><p class="card-label">Students in Semester</p><div class="stat-value" id="studentCount">–</div></div>
            <div class="card"><p class="card-label">Average Balance Score</p><div class="stat-value" id="avgBalance">–</div></div>
            <div class="card"><p class="card-label">Average Workload Index</p><div class="stat-value" id="avgWorkload">–</div></div>
        </div>

        <div class="grid-2">
            <div class="card">
                <p class="card-label">Burnout Risk Distribution</p>
                <canvas id="riskChart"></canvas>
            </div>
            <div class="card">
                <p class="card-label">Department Trend Comparison</p>
                <canvas id="deptChart"></canvas>
            </div>
        </div>

        <form class="card card-narrow" id="facultyForm">
            <h2>Create Faculty Account</h2>
            <label for="fUsername">Username</label>
            <input type="text" id="fUsername" autocomplete="off" required>
            <label for="fName">Full name</label>
            <input type="text" id="fName" required>
            <label for="fDept">Department</label>
            <input type="text" id="fDept" placeholder="e.g. CSE">
            <label for="fPassword">Password (at least 8 characters)</label>
            <input type="password" id="fPassword" autocomplete="new-password" minlength="8" required>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Account</button>
            </div>
        </form>
    </main>

    <script>
        let riskChart, deptChart;

        const RISK_COLORS = { HIGH: '#e5266f', MEDIUM: '#e8890c', LOW: '#4cc9f0' };

        async function loadSemesterReport() {
            const sem = document.getElementById('semInput').value || 1;
            try {
                const res = await api(`/api/admin/report/${encodeURIComponent(sem)}`);
                if (!res.ok) return toast(await errorText(res), 'error');
                const data = await res.json();

                document.getElementById('studentCount').innerText = data.studentCount ?? 0;
                document.getElementById('avgBalance').innerText = (data.averageBalanceScore ?? 0) + '%';
                document.getElementById('avgWorkload').innerText = data.averageWorkloadIndex ?? 0;

                const dist = data.riskDistribution || {};
                if (riskChart) riskChart.destroy();
                riskChart = new Chart(document.getElementById('riskChart').getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(dist),
                        datasets: [{ data: Object.values(dist), backgroundColor: Object.keys(dist).map(k => RISK_COLORS[k] || '#c4c9d4') }]
                    }
                });
            } catch (err) { console.error('Semester report load error', err); }
        }

        async function loadDepartmentTrends() {
            try {
                const res = await api('/api/admin/trends');
                if (!res.ok) return;
                const rows = await res.json();
                if (deptChart) deptChart.destroy();
                deptChart = new Chart(document.getElementById('deptChart').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: rows.map(r => `${r.department} (${r.studentCount})`),
                        datasets: [{ label: 'Average Balance Score', data: rows.map(r => r.averageBalanceScore), backgroundColor: '#4361ee' }]
                    },
                    options: { aspectRatio: chartAspect(), plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
                });
            } catch (err) { console.error('Department trends load error', err); }
        }

        document.getElementById('reportForm').addEventListener('submit', e => {
            e.preventDefault();
            withBusy(e.submitter, loadSemesterReport);
        });

        document.getElementById('facultyForm').addEventListener('submit', e => {
            e.preventDefault();
            const form = e.target;
            const body = {
                username: document.getElementById('fUsername').value.trim(),
                name: document.getElementById('fName').value.trim(),
                department: document.getElementById('fDept').value.trim(),
                password: document.getElementById('fPassword').value
            };
            withBusy(e.submitter, async () => {
                const res = await api('/api/admin/create-faculty', { method: 'POST', body });
                if (!res.ok) return toast(await errorText(res), 'error');
                toast(`Faculty account "${body.username}" created`, 'success');
                form.reset();
            });
        });

        if (requireRole('ADMIN')) {
            document.getElementById('sideName').innerText = Session.user;
            loadSemesterReport();
            loadDepartmentTrends();
        }
    </script>
</body>
</html>
