<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusBalance | Staff Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1>CampusBalance</h1>
            <p class="subtitle">Staff access — Admin &amp; Faculty</p>

            <form id="loginForm">
                <label for="uid">Username</label>
                <input type="text" id="uid" placeholder="Your staff username" autocomplete="username" required>
                <label for="psw">Password</label>
                <input type="password" id="psw" placeholder="••••••••" autocomplete="current-password" required>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">Log In</button>
                </div>
            </form>

            <!-- Shown only until the first admin account exists -->
            <div id="setupSection" hidden>
                <div class="divider"><span>First-time setup</span></div>
                <form id="setupForm" class="setup-box">
                    <h3>No admin account exists yet</h3>
                    <p>Create the one initial admin account. This form disappears once it exists — faculty accounts are then created from the admin dashboard.</p>
                    <label for="aid">Admin username</label>
                    <input type="text" id="aid" placeholder="e.g. admin1" autocomplete="off" required>
                    <label for="aname">Full name</label>
                    <input type="text" id="aname" placeholder="Your name" required>
                    <label for="adept">Department</label>
                    <input type="text" id="adept" placeholder="e.g. Administration">
                    <label for="apsw">Password (at least 8 characters)</label>
                    <input type="password" id="apsw" autocomplete="new-password" minlength="8" required>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-block">Create Admin Account</button>
                    </div>
                </form>
            </div>

            <p class="auth-footer">Student? <a href="login.html">Student login</a></p>
        </div>
    </div>

    <script>
        async function checkAdminExists() {
            try {
                const res = await api('/api/admin-exists', { auth: false });
                document.getElementById('setupSection').hidden = await res.json();
            } catch (err) {
                console.error('Could not check admin status', err);
            }
        }

        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            const username = document.getElementById('uid').value.trim();
            const password = document.getElementById('psw').value;

            withBusy(e.submitter, async () => {
                Session.clear(); // drop any old/expired login before starting a new one
                const res = await api('/api/login', { method: 'POST', auth: false, body: { username, password } });
                if (!res.ok) return toast('Incorrect username or password', 'error');
                const account = await res.json();
                if (account.role === 'STUDENT') {
                    return toast('This is a student account — please use the student login page.', 'error');
                }
                Session.save(account);
                window.location.href = HOME_PAGE_BY_ROLE[account.role];
            });
        });

        document.getElementById('setupForm').addEventListener('submit', e => {
            e.preventDefault();
            const body = {
                username: document.getElementById('aid').value.trim(),
                name: document.getElementById('aname').value.trim(),
                department: document.getElementById('adept').value.trim(),
                password: document.getElementById('apsw').value
            };

            withBusy(e.submitter, async () => {
                const res = await api('/api/register-admin', { method: 'POST', auth: false, body });
                if (!res.ok) {
                    toast(await errorText(res), 'error');
                } else {
                    toast('Admin account created! You can now log in above.', 'success');
                }
                checkAdminExists();
            });
        });

        checkAdminExists();
    </script>
</body>
</html>
