# Replaces the main application.properties during tests, so tests never read .env or touch the
# real database: the dummy local URI is never connected to (the driver connects lazily) and the
# startup data migrations are switched off.
spring.data.mongodb.uri=mongodb://localhost:27017/campusbalance-test
app.migrations.enabled=false
app.jwt.secret=test-only-secret-that-is-at-least-32-characters
spring.jackson.deserialization.fail-on-null-for-primitives=true
