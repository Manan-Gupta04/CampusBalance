<!DOCTYPE html>
<html>
<head>
    <title>CampusBalance | Secure Login</title>
    <script src="config.js"></script>
    <style>
        :root { --primary: #4361ee; --dark: #1a1a2e; }
        body { background: var(--dark); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center;}
        h1 { color: var(--primary); margin: 0 0 10px 0; font-size: 26px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; font-weight: bold; color: #555; margin-left: 5px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 12px; cursor: pointer; border: none; border-radius: 8px; font-weight: 600; margin-top: 10px; transition: 0.3s; }
        .btn-login { background: var(--primary); color: white; margin-top: 20px; }
        .btn-login:hover { background: #3046bc; transform: translateY(-2px); }
        .btn-reg { background: transparent; color: var(--primary); border: 1px solid var(--primary); font-size: 13px; margin-top: 15px;}
        .btn-reg:hover { background: #f0f2ff; }
        .divider { margin: 20px 0; border-top: 1px solid #eee; position: relative; }
        .divider span { position: absolute; top: -10px; background: white; padding: 0 10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #999;}
    </style>
</head>
<body>
    <div class="card">
        <h1>CampusBalance</h1>
        <p>Student Well-being Analytics</p>

        <div class="input-group">
            <label>USERNAME / COLLEGE ID</label>
            <input type="text" id="uid" placeholder="e.g. cs23001">
        </div>

        <div id="regFields" style="display: none;">
            <div class="input-group">
                <label>FULL NAME</label>
                <input type="text" id="uname" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>DEPARTMENT</label>
                <input type="text" id="udept" placeholder="e.g. CSE">
            </div>
        </div>

        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="psw" placeholder="••••••••">
        </div>

        <button class="btn btn-login" id="mainBtn" onclick="handleAuth()">Enter Dashboard</button>

        <div class="divider"><span>OR</span></div>

        <button class="btn btn-reg" id="toggleBtn" onclick="toggleMode()">Create New Account</button>
    </div>

    <script>
        let isRegisterMode = false;

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            const regFields = document.getElementById('regFields');
            const mainBtn = document.getElementById('mainBtn');
            const toggleBtn = document.getElementById('toggleBtn');

            if (isRegisterMode) {
                regFields.style.display = 'block';
                mainBtn.innerText = "Finalize Registration";
                toggleBtn.innerText = "Back to Login";
            } else {
                regFields.style.display = 'none';
                mainBtn.innerText = "Enter Dashboard";
                toggleBtn.innerText = "Create New Account";
            }
        }

        function redirectForRole(role) {
            if (role === 'FACULTY') window.location.href = 'faculty.html';
            else if (role === 'ADMIN') window.location.href = 'admin.html';
            else window.location.href = 'index.html';
        }

        async function handleAuth() {
            const username = document.getElementById('uid').value.trim();
            const password = document.getElementById('psw').value;

            if (!username || !password) return alert("Please fill in your ID and password");

            if (isRegisterMode) {
                const name = document.getElementById('uname').value.trim();
                const department = document.getElementById('udept').value.trim();
                if (!name) return alert("Please enter your name");

                try {
                    // This page only ever creates STUDENT accounts — the backend enforces
                    // that regardless of what's sent, but we don't even offer a role choice here.
                    const response = await fetch(`${API_BASE}/api/register`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username, name, password, department,
                            btechStartDate: "2023-08", btechEndDate: "2027-05"
                        })
                    });
                    if (response.ok) { alert("Registered! Now login."); toggleMode(); }
                    else { alert("Registration failed — that username may already be taken."); }
                } catch (err) {
                    alert("Could not reach the server. Is the backend running?");
                }
            } else {
                try {
                    const response = await fetch(`${API_BASE}/api/login`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ username, password })
                    });

                    if (response.ok) {
                        const student = await response.json();
                        localStorage.setItem('activeUser', username);
                        localStorage.setItem('activeRole', student.role || 'STUDENT');
                        redirectForRole(student.role || 'STUDENT');
                    } else {
                        alert("Login Failed: Incorrect ID or Password");
                    }
                } catch (err) {
                    alert("Could not reach the server. Is the backend running?");
                }
            }
        }
    </script>
</body>
</html>
